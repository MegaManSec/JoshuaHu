{% if page.url == "/" %}
  {% assign title_tag = "h1" %}
{% else %}
  {% assign title_tag = "h3" %}
{% endif %}

<header class="header">
  <{{ title_tag }} class="header-title">
    <a href="{{ site.url | default: '/' }}">{{ site.title }}</a>
    <small class="header-subtitle">{{ site.header_subtitle }}</small>
  </{{ title_tag }}>

  {% include menu.html %}
</header>
