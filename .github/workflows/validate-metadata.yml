name: Validate metadata

# Builds the site with Jekyll and validates the metadata that actually ships:
# Open Graph / Twitter tags, JSON-LD, canonical URLs, social-image existence
# and dimensions, and per-article uniqueness. Runs on every push/PR (no path
# filter) so it always reports and needs no no-op twin for branch protection.

on:
  push:
    branches: [gh-pages]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Built-site metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Generate social cards
        run: python3 .github/social-card/generate.py --posts

      - name: Build site
        run: bundle exec jekyll build

      - name: Validate social and structured metadata
        run: python3 .github/scripts/validate_metadata.py
