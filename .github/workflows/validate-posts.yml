name: Validate posts

on:
  push:
    branches: [gh-pages]
    paths:
      - "_posts/**"
      - "menu/topics.md"
      - ".github/workflows/validate-posts.yml"
      - ".github/scripts/validate_posts.py"
  pull_request:
    paths:
      - "_posts/**"
      - "menu/topics.md"
      - ".github/workflows/validate-posts.yml"
      - ".github/scripts/validate_posts.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Frontmatter + topics.md coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate every post has tags, description, and a topics.md link
        run: python3 .github/scripts/validate_posts.py
