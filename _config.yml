# Site Build Settings

# Jekyll-paginate-v2 configuration
#  pagination:
#   enabled: true
#   per_page: 5
#   permalink: '/page/:num/'
#   title: ':title - page :num of :max'
#   limit: 0
#   sort_field: 'date'
#   sort_reverse: true

# jekyll-paginate configuration
paginate:            500

# Build settings
markdown:            kramdown
highlighter:         rouge
permalink:           /:title
plugins:             [jekyll-paginate, jekyll-sitemap, jekyll-feed, jekyll-seo-tag]

kramdown:
  header_offset: 1

# Customise atom feed settings (this is where Jekyll-Feed gets configuration information)
title:		           "Joshua Rogers' Scribbles"
url:		           "https://joshua.hu"
# Used by jekyll-seo-tag (meta/og description fallback) and jekyll-feed (subtitle).
# The visible header subtitle is site.header_subtitle (unset), see _includes/header.html.
description:	       "Joshua Rogers is an Australian technologist, sysadmin, security engineer, and pentester sharing long-form writeups on hacking, binary web and infra security, programming, technology, politics, and life itself."
# Publisher logo for jekyll-seo-tag JSON-LD (BlogPosting publisher on articles).
logo:		           /web-app-manifest-512x512.png
author:
  name: Joshua Rogers
  twitter: MegaManSec

twitter:
  username: MegaManSec
  card: summary_large_image

social:
  name: Joshua Rogers
  links:
    - https://github.com/MegaManSec
    - https://x.com/MegaManSec
    - https://www.linkedin.com/in/joshua-alexander-rogers
    - https://news.ycombinator.com/user?id=mmsc

include: [llms.txt, llms-full.txt]

# Default social-sharing image for every page/post. jekyll-seo-tag picks it up
# (og:image, twitter:image, twitter:card=summary_large_image, JSON-LD image);
# posts can override it with their own `image:` front matter. The post layout
# and head.html special-case this exact path -- keep them in sync if renamed.
# Regenerate the card with: python3 .github/social-card/generate.py
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/social-card.png

# RSS 2.0 can be used instead of Atom by uncommenting following two lines
#feed:
#  path: rss-feed.xml
