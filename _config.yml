# Site Build Settings

# Jekyll-paginate-v2 configuration
#  pagination:
#   enabled: true
#   per_page: 5
#   permalink: '/page/:num/'
#   title: ':title - page :num of :max'
#   limit: 0
#   sort_field: 'date'
#   sort_reverse: true

# jekyll-paginate configuration
paginate:            500

# Build settings
markdown:            kramdown
highlighter:         rouge
permalink:           /:title
plugins:             [jekyll-paginate, jekyll-sitemap, jekyll-feed, jekyll-seo-tag]

kramdown:
  header_offset: 1

# Customise atom feed settings (this is where Jekyll-Feed gets configuration information)
title:		           "Joshua Rogers' Scribbles"
description:	       '' #Joshua.Hu is the personal blog of security researcher and hacker Joshua Rogers. This blog offers the typical observations and commentary on life and technology, focused on security.'
author:
  name: Joshua Rogers
  twitter: MegaManSec

twitter:
  username: MegaManSec

social:
  name: Joshua Rogers
  links:
    - https://github.com/MegaManSec
    - https://x.com/MegaManSec
    - https://www.linkedin.com/in/joshua-alexander-rogers
    - https://news.ycombinator.com/user?id=mmsc

include: [llms.txt, llms-full.txt]

