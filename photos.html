<style>

}.photo-gallery *{box-sizing:border-box}.photo-gallery{scroll-behavior:smooth}.photo-gallery{margin:0;background:var(--bg);color:var(--text);font-family:var(--serif);
  font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}.photo-gallery a{color:var(--dark);text-decoration:underline}.photo-gallery a:hover{color:#000}.photo-gallery img{max-width:100%;height:auto;display:block;border-radius:5px}.photo-gallery h1, .photo-gallery h2, .photo-gallery h3, .photo-gallery h4{font-family:var(--sans);color:var(--dark);font-weight:400;margin:0}.photo-gallery .wrap{max-width:1080px;margin:0 auto;padding:0 22px}.photo-gallery .site{padding-top:.55rem;border-bottom:1px solid var(--line);margin-bottom:.8rem}.photo-gallery .site .title{font-family:var(--sans);font-size:1.6rem;line-height:1.2;margin:0}.photo-gallery .site .title a{color:var(--text);text-decoration:none}.photo-gallery .site .subtitle{color:var(--gray);font-family:var(--sans);font-size:.95rem}.photo-gallery .menu{display:flex;flex-wrap:wrap;align-items:center;gap:2px 14px;padding:.4rem 0 .5rem}.photo-gallery .menu .links a{color:var(--gray);font-family:var(--sans);font-size:1rem;text-decoration:none;padding-right:10px}.photo-gallery .menu .links a:hover{color:#000}.photo-gallery .menu .links a.current{color:var(--dark);font-weight:700}.photo-gallery .menu .social{margin-left:auto;display:flex;gap:14px}.photo-gallery .menu .social a{color:var(--gray);display:inline-flex}.photo-gallery .menu .social a:hover{color:#000}.photo-gallery .menu .social svg{width:17px;height:17px;fill:currentColor;display:block}.photo-gallery .masthead{margin:.5rem 0 .6rem;display:flex;flex-wrap:wrap;align-items:flex-end;gap:.4rem 2rem}.photo-gallery .masthead .head-left{flex:1 1 260px}.photo-gallery .masthead h1{font-size:1.9rem;line-height:1.05;letter-spacing:.2px}.photo-gallery .lede{color:var(--gray);max-width:58ch;margin:.3rem 0 0;font-size:.92rem}.photo-gallery .stats{list-style:none;display:flex;flex-wrap:wrap;gap:0;margin:0;padding:0}.photo-gallery .stats li{padding:0 18px;border-left:1px solid var(--line)}.photo-gallery .stats li:first-child{padding-left:0;border-left:0}.photo-gallery .stats b{display:block;font-family:var(--sans);font-size:1.35rem;color:var(--dark);line-height:1.1}.photo-gallery .stats span{font-size:.68rem;color:var(--gray);text-transform:uppercase;letter-spacing:.12em;font-family:var(--sans)}.photo-gallery .hero{margin:.7rem 0 .2rem}.photo-gallery .hero img{width:100%;height:30vh;min-height:200px;object-fit:cover;object-position:center 42%;border-radius:6px}.photo-gallery .hero figcaption{color:var(--gray);font-size:.8rem;font-family:var(--sans);margin-top:7px;text-align:right}.photo-gallery .controls{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:1.6rem 0 0;padding:.7rem 0}.photo-gallery .controls .wrap{padding-top:0;padding-bottom:0}.photo-gallery .ctrl-sentinel{height:1px;margin:0;padding:0;pointer-events:none}.photo-gallery .controls.stuck{padding:.45rem 0}.photo-gallery .controls.stuck .countrybox, .photo-gallery .controls.stuck .years{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;padding-bottom:5px;scrollbar-width:thin}.photo-gallery .controls.stuck .countrybox .cc, .photo-gallery .controls.stuck .years .yr{flex:0 0 auto}.photo-gallery .controls.stuck .countrybox::-webkit-scrollbar, .photo-gallery .controls.stuck .years::-webkit-scrollbar{height:6px}.photo-gallery .controls.stuck .countrybox::-webkit-scrollbar-thumb, .photo-gallery .controls.stuck .years::-webkit-scrollbar-thumb{background:var(--creamln);border-radius:3px}.photo-gallery .ctrl-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:.25rem 0}.photo-gallery .ctrl-label{font-family:var(--sans);font-size:.7rem;text-transform:uppercase;letter-spacing:.13em;
  color:var(--gray);margin-right:4px;min-width:74px}.photo-gallery .pill, .photo-gallery .cc, .photo-gallery .yr{font-family:var(--sans);font-size:.82rem;border:1px solid var(--creamln);background:var(--cream);
  color:var(--dark);padding:4px 11px;border-radius:999px;cursor:pointer;transition:.15s;line-height:1.4;text-decoration:none}.photo-gallery .pill:hover, .photo-gallery .cc:hover, .photo-gallery .yr:hover{background:var(--cream2);border-color:#d9cca8}.photo-gallery .pill.active, .photo-gallery .cc.active, .photo-gallery .yr.active{background:var(--dark);color:#fff;border-color:var(--dark)}.photo-gallery .cc span{opacity:.55;font-size:.74rem;margin-left:2px}.photo-gallery .countrybox{display:flex;flex-wrap:wrap;gap:7px;align-items:flex-start}.photo-gallery .years{display:flex;flex-wrap:wrap;gap:7px}.photo-gallery .yr{font-variant-numeric:tabular-nums}.photo-gallery .count{font-family:var(--sans);font-size:.76rem;color:var(--gray);margin-left:auto}.photo-gallery main{padding-bottom:5rem}.photo-gallery .year{font-family:var(--sans);font-size:2.4rem;color:var(--dark);margin:2.6rem 0 .2rem;
  padding-bottom:.25rem;border-bottom:1px solid var(--line);scroll-margin-top:84px}.photo-gallery .chapter{margin:1.7rem 0 0;scroll-margin-top:96px}.photo-gallery .chapter-title{font-family:var(--sans);font-size:.78rem;text-transform:uppercase;letter-spacing:.14em;
  color:var(--gray);margin:0 0 .8rem;font-weight:700}.photo-gallery .chapter-title a{color:inherit;text-decoration:none}.photo-gallery .chapter-title a:hover{color:var(--dark)}.photo-gallery .chapter-title a::after{content:" #";color:var(--creamln);opacity:0;transition:.15s}.photo-gallery .chapter-title a:hover::after{opacity:1;color:var(--gray)}.photo-gallery .grid{column-width:250px;column-gap:12px}.photo-gallery figure.ph{break-inside:avoid;margin:0 0 12px;position:relative;cursor:zoom-in;border-radius:6px;overflow:hidden;background:var(--soft)}.photo-gallery figure.ph img{width:100%;transition:transform .5s ease, opacity .4s;border-radius:6px}.photo-gallery figure.ph:hover img{transform:scale(1.035)}.photo-gallery figure.ph figcaption{position:absolute;left:0;right:0;bottom:0;padding:22px 11px 9px;
  font-family:var(--sans);font-size:.74rem;color:#fff;
  background:linear-gradient(0deg,rgba(0,0,0,.72),transparent);opacity:0;transition:.2s}.photo-gallery figure.ph:hover figcaption{opacity:1}.photo-gallery .hide{display:none !important}.photo-gallery .footer{color:var(--gray);text-align:center;margin:3rem 0 2rem;font-family:var(--sans)}.photo-gallery .footer .social{display:flex;gap:16px;justify-content:center;margin-bottom:.6rem}.photo-gallery .footer .social a{color:var(--gray)}.photo-gallery .footer .social a:hover{color:var(--dark)}.photo-gallery .footer .social svg{width:18px;height:18px;fill:currentColor}.photo-gallery .footer .desc{font-size:.8rem}.photo-gallery .footer .desc a{color:var(--gray);text-decoration:none}.photo-gallery .lb{position:fixed;inset:0;z-index:90;background:rgba(255,255,255,.97);display:none;
  flex-direction:column;align-items:center;justify-content:center}.photo-gallery .lb.open{display:flex}.photo-gallery .lb img{max-width:92vw;max-height:82vh;border-radius:6px;box-shadow:0 12px 50px rgba(0,0,0,.18)}.photo-gallery .lb .cap{font-family:var(--sans);color:var(--dark);font-size:.9rem;margin-top:14px;text-align:center;padding:0 18px}.photo-gallery .lb .cap .sub{color:var(--gray);font-size:.78rem}.photo-gallery .lb .x{position:absolute;top:16px;right:22px;font-size:30px;color:var(--gray);cursor:pointer;line-height:1;font-family:var(--sans)}.photo-gallery .lb .x:hover{color:#000}.photo-gallery .lb .nav{position:absolute;top:50%;transform:translateY(-50%);font-size:40px;color:var(--gray);
  cursor:pointer;user-select:none;padding:10px 18px;font-family:var(--sans)}.photo-gallery .lb .nav:hover{color:#000}.photo-gallery .lb .prev{left:6px}.photo-gallery .lb .next{right:6px}@media(max-width:600px){.photo-gallery .masthead{margin:.3rem 0 .4rem}.photo-gallery .masthead h1{font-size:1.55rem}.photo-gallery .lede{font-size:.85rem;margin:.2rem 0 0}.photo-gallery .stats b{font-size:1.15rem}.photo-gallery .stats li{padding:0 12px}.photo-gallery .hero{margin:.5rem 0 .2rem}.photo-gallery .hero img{height:20vh;min-height:130px}.photo-gallery .controls{padding:.4rem 0;margin:1rem 0 0}.photo-gallery .ctrl-label{display:none}.photo-gallery .ctrl-row{margin:.18rem 0}.photo-gallery .year{font-size:1.9rem;margin:1.7rem 0 .2rem}.photo-gallery .grid{column-width:auto;column-count:2;column-gap:8px}.photo-gallery figure.ph{margin:0 0 8px}}.photo-gallery{width:min(94vw,1120px);margin-left:calc(50% - min(47vw,560px));margin-top:1rem}.photo-gallery .pg-msg{font-family:var(--sans);color:var(--gray);padding:3rem 0;text-align:center;font-size:.95rem}
</style>
<div class="photo-gallery" id="pg">
<noscript><p class="pg-msg">This gallery needs JavaScript to load. See <a href="https://github.com/MegaManSec">my projects</a> meanwhile.</p></noscript>
<p class="pg-msg">Loading photographs…</p>
</div>
<script>
(function(){
var DATA_URL='/assets/photos.json';
var PG=document.getElementById('pg');
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
var META={},state={countries:[],years:[],hl:false},figs=[],chapters=[],blocks=[],countEl,visible=[],lb,lbimg,lbcap,cur=-1,ctrls;
fetch(DATA_URL).then(function(r){if(!r.ok)throw 0;return r.json();}).then(render).catch(function(){
  PG.textContent='';PG.appendChild(el('p','pg-msg','Sorry — the gallery data could not be loaded.'));
});
function render(D){
  var ASSET=(D.asset||'').replace(/\/$/,'');
  var photos=(D.photos||[]).slice().sort(function(a,b){return a.ord-b.ord;});
  function thumb(id){return ASSET+'/thumb/'+id+'.jpg';}
  function full(id){return ASSET+'/full/'+id+'.jpg';}
  photos.forEach(function(p){META[p.id]={f:full(p.id),l:p.loc,d:p.date,c:p.desc};});
  var years=Array.from(new Set(photos.map(function(p){return p.y;}).filter(function(y){return y&&y!=='0000';}))).sort();
  var nC=new Set(photos.map(function(p){return p.country;}).filter(Boolean)).size;
  var nCh=new Set(photos.map(function(p){return p.trip;}).filter(Boolean)).size;
  var ylo=years[0]||'',yhi=years[years.length-1]||'';
  PG.textContent='';
  // masthead + hero
  var w1=el('div','wrap');
  var mh=el('section','masthead'),hl=el('div','head-left');
  hl.appendChild(el('h1',null,'A Life in Photos'));
  hl.appendChild(el('p','lede','A photographic timeline of my life and travels — '+photos.length.toLocaleString()+' photographs across '+nC+' countries, '+ylo+'–'+yhi+'.'));
  mh.appendChild(hl);
  var stats=el('ul','stats');
  [[photos.length.toLocaleString(),'Photographs'],[String(nC),'Countries'],[String(nCh),'Chapters'],[ylo+'–'+yhi,'Years']].forEach(function(s){
    var li=document.createElement('li');li.appendChild(el('b',null,s[0]));li.appendChild(el('span',null,s[1]));stats.appendChild(li);
  });
  mh.appendChild(stats);w1.appendChild(mh);
  var hero=el('figure','hero'),him=document.createElement('img');him.src=full(D.hero);him.alt='Featured photograph';hero.appendChild(him);w1.appendChild(hero);
  PG.appendChild(w1);
  // controls
  PG.appendChild(el('div','ctrl-sentinel'));
  var ctr=el('div','controls'),cw=el('div','wrap');
  var r1=el('div','ctrl-row');r1.appendChild(el('span','ctrl-label','Show'));
  var pa=el('button','pill view active','All');pa.dataset.view='all';
  var ph=el('button','pill view','★ Highlights');ph.dataset.view='hl';
  countEl=el('span','count');r1.appendChild(pa);r1.appendChild(ph);r1.appendChild(countEl);cw.appendChild(r1);
  var r2=el('div','ctrl-row');r2.style.alignItems='flex-start';r2.appendChild(el('span','ctrl-label','Countries'));
  var cbox=el('div','countrybox');
  var cc={};photos.forEach(function(p){if(p.country)cc[p.country]=(cc[p.country]||0)+1;});
  var allc=el('button','cc active');allc.dataset.country='all';allc.appendChild(document.createTextNode('All countries '));var sa=el('span',null,String(photos.length));allc.appendChild(sa);cbox.appendChild(allc);
  Object.keys(cc).sort(function(a,b){return cc[b]-cc[a]||a.localeCompare(b);}).forEach(function(c){
    var b=el('button','cc');b.dataset.country=c;b.appendChild(document.createTextNode(c+' '));b.appendChild(el('span',null,String(cc[c])));cbox.appendChild(b);
  });
  r2.appendChild(cbox);cw.appendChild(r2);
  var r3=el('div','ctrl-row');r3.style.alignItems='flex-start';r3.appendChild(el('span','ctrl-label','Years'));
  var yn=el('nav','years');var ay=el('button','yr active','All years');ay.dataset.year='all';yn.appendChild(ay);
  years.forEach(function(y){var b=el('button','yr',y);b.dataset.year=y;yn.appendChild(b);});
  r3.appendChild(yn);cw.appendChild(r3);ctr.appendChild(cw);PG.appendChild(ctr);
  // timeline
  var tl=el('div','wrap'),curY=null,curT=null,yb=null,grid=null;
  photos.forEach(function(p){
    if(!p.y||p.y==='0000')return;
    if(p.trip!==curT){
      curT=p.trip;
      if(p.y!==curY){curY=p.y;yb=el('section','yearblock');yb.dataset.year=p.y;yb.id='y'+p.y;yb.appendChild(el('h2','year',p.y));tl.appendChild(yb);}
      var ch=el('div','chapter');if(p.trip)ch.id=p.trip;
      if(p.td){var h3=el('h3','chapter-title');var a=document.createElement('a');a.href='#'+p.trip;a.textContent=p.td;h3.appendChild(a);ch.appendChild(h3);}
      grid=el('div','grid');ch.appendChild(grid);yb.appendChild(ch);
    }
    var fig=el('figure','ph');fig.dataset.id=p.id;fig.dataset.country=p.country;fig.dataset.year=p.y;fig.dataset.theme=p.th;if(p.hl)fig.dataset.hl='1';
    var im=document.createElement('img');im.loading='lazy';im.src=thumb(p.id);im.alt=p.desc||p.loc||'';fig.appendChild(im);
    fig.appendChild(el('figcaption',null,p.loc+(p.loc&&p.date?' · ':'')+p.date));
    grid.appendChild(fig);
  });
  PG.appendChild(tl);
  // lightbox
  lb=el('div','lb');var x=el('span','x');x.innerHTML='&times;';var pv=el('span','nav prev');pv.innerHTML='&#8249;';var nx=el('span','nav next');nx.innerHTML='&#8250;';
  lbimg=document.createElement('img');lbcap=el('div','cap');
  lb.appendChild(x);lb.appendChild(pv);lb.appendChild(nx);lb.appendChild(lbimg);lb.appendChild(lbcap);PG.appendChild(lb);
  x.onclick=function(){lb.classList.remove('open');};
  pv.onclick=function(e){e.stopPropagation();step(-1);};
  nx.onclick=function(e){e.stopPropagation();step(1);};
  lb.onclick=function(e){if(e.target===lb)lb.classList.remove('open');};
  wire();
}
function apply(){
  var n=0;
  figs.forEach(function(f){
    var ok=(state.countries.length===0||state.countries.indexOf(f.dataset.country)>=0)
      &&(state.years.length===0||state.years.indexOf(f.dataset.year)>=0)&&(!state.hl||f.dataset.hl==='1');
    f.classList.toggle('hide',!ok);if(ok)n++;
  });
  chapters.forEach(function(c){c.classList.toggle('hide',!c.querySelector('figure.ph:not(.hide)'));});
  blocks.forEach(function(b){b.classList.toggle('hide',!b.querySelector('.chapter:not(.hide)'));});
  var ccnt={},ctot=0,ycnt={};
  figs.forEach(function(f){
    var pc=(state.countries.length===0||state.countries.indexOf(f.dataset.country)>=0);
    var py=(state.years.length===0||state.years.indexOf(f.dataset.year)>=0);
    var phh=(!state.hl||f.dataset.hl==='1');
    if(py&&phh){ccnt[f.dataset.country]=(ccnt[f.dataset.country]||0)+1;ctot++;}
    if(pc&&phh){ycnt[f.dataset.year]=(ycnt[f.dataset.year]||0)+1;}
  });
  document.querySelectorAll('.cc').forEach(function(x){
    var v=x.getAttribute('data-country'),s=x.querySelector('span');
    if(v==='all'){if(s)s.textContent=ctot;return;}
    var c=ccnt[v]||0;if(s)s.textContent=c;x.classList.toggle('hide',c===0&&state.countries.indexOf(v)<0);
  });
  document.querySelectorAll('.yr').forEach(function(x){
    var v=x.getAttribute('data-year');if(v==='all')return;
    x.classList.toggle('hide',(ycnt[v]||0)===0&&state.years.indexOf(v)<0);
  });
  countEl.textContent=n+' / '+figs.length+' photographs';
  visible=figs.filter(function(f){return !f.classList.contains('hide');});
}
function syncChips(sel,arr,attr){
  document.querySelectorAll(sel).forEach(function(x){
    var v=x.getAttribute('data-'+attr);x.classList.toggle('active',v==='all'?arr.length===0:arr.indexOf(v)>=0);
  });
}
function toggleSet(arr,v){var i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else arr.push(v);}
function show(){
  if(cur<0||cur>=visible.length)return;
  var id=visible[cur].dataset.id,m=META[id];if(!m)return;
  lbimg.src=m.f;lbimg.alt=m.c||m.l||'';
  var sub=[m.l,m.d].filter(Boolean).join(' · ');
  lbcap.textContent='';
  if(m.c){var d=document.createElement('div');d.textContent=m.c;lbcap.appendChild(d);}
  var s=document.createElement('div');s.className='sub';s.textContent=sub;lbcap.appendChild(s);
}
function step(d){cur=(cur+d+visible.length)%visible.length;show();}
function wire(){
  figs=[].slice.call(document.querySelectorAll('figure.ph'));
  chapters=[].slice.call(document.querySelectorAll('.chapter'));
  blocks=[].slice.call(document.querySelectorAll('.yearblock'));
  document.querySelectorAll('.pill.view').forEach(function(p){p.onclick=function(){
    document.querySelectorAll('.pill.view').forEach(function(z){z.classList.remove('active');});
    p.classList.add('active');state.hl=(p.dataset.view==='hl');apply();
  };});
  document.querySelectorAll('.cc').forEach(function(c){c.onclick=function(){
    if(c.dataset.country==='all')state.countries=[];else toggleSet(state.countries,c.dataset.country);
    syncChips('.cc',state.countries,'country');apply();
  };});
  document.querySelectorAll('.yr').forEach(function(c){c.onclick=function(){
    if(c.dataset.year==='all')state.years=[];else toggleSet(state.years,c.dataset.year);
    syncChips('.yr',state.years,'year');apply();
  };});
  ctrls=document.querySelector('.controls');
  var sentinel=document.querySelector('.ctrl-sentinel');
  if(window.IntersectionObserver&&sentinel){new IntersectionObserver(function(es){ctrls.classList.toggle('stuck',!es[0].isIntersecting);},{threshold:0}).observe(sentinel);}
  figs.forEach(function(f){f.onclick=function(){cur=visible.indexOf(f);show();lb.classList.add('open');};});
  document.addEventListener('keydown',function(e){
    if(!lb.classList.contains('open'))return;
    if(e.key==='Escape')lb.classList.remove('open');else if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1);
  });
  apply();
  if(location.hash==='#highlights'){var b=document.querySelector('.pill.view[data-view="hl"]');if(b)b.click();}
}
})();
</script>
